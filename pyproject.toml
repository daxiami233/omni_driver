[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni_driver"
version = "0.2.0"
description = "Unified Android (ADB/uiautomator2) and HarmonyOS (HDC/hmdriver2) device automation driver"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "uiautomator2>=3.0",
    "hmdriver2>=1.4",
]

[tool.setuptools.packages.find]
include = ["automator*", "connector*", "model*", "app*"]
